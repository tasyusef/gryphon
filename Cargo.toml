[workspace]
resolver = "3"
members = ["crates/shared", "crates/core", "crates/cli", "crates/app", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
gryphon-shared = { path = "crates/shared" }
gryphon-core = { path = "crates/core" }

[profile.release]
lto = "thin"
codegen-units = 4

[profile.dev.package."*"]
opt-level = 2
