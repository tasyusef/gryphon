[package]
name = "gryphon-app"
description = "Gryphon: WoW Forever addons from GitHub and CurseForge, in a window."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gryphon-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
gryphon-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
# Updates to Gryphon itself (src/update.rs), over the rustls the addon downloads already use.
# No zip: the packages are the .app.tar.gz, the installer, the AppImage and the deb as built.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }
