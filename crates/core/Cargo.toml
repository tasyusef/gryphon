[package]
name = "gryphon-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Finding the game, reading TOCs, GitHub releases, and installing. No UI: the CLI and the
# Tauri shell both drive it.

[dependencies]
gryphon-shared.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "fs", "io-util", "macros", "sync"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
