[package]
name = "gryphon-ui"
description = "Gryphon's page: Leptos, compiled to WASM by Trunk (index.html)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gryphon-shared.workspace = true
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "MediaQueryList", "Window"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
